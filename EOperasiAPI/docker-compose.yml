services:
  db:
    image: postgres:17
    container_name: eoperasi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: eoperasi
      POSTGRES_PASSWORD: devpassword123
      POSTGRES_DB: eoperasi
    ports:
      - "5432:5432"
    volumes:
      - eoperasi-pgdata:/var/lib/postgresql/data

volumes:
  eoperasi-pgdata: